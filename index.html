<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fef2f4 0%, #f3e8ff 50%, #e0e7ff 100%);
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating background elements */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: float 8s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Card Box */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      z-index: 2;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: #ffe4e6;
      color: #e11d48;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 1.8rem;
      color: #1e293b;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    /* Secret Message Box */
    .message-box {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
      opacity: 0;
      background: #ffffff;
      border-radius: 16px;
      padding: 0 16px;
      text-align: left;
      border: 1px dashed #cbd5e1;
    }

    .message-box.open {
      max-height: 300px;
      opacity: 1;
      padding: 20px 16px;
      margin-bottom: 20px;
    }

    .message-box p {
      color: #334155;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* Button */
    .btn {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Floating hearts when clicked */
    .heart {
      position: absolute;
      color: #fb7185;
      font-size: 20px;
      pointer-events: none;
      animation: rise 2s linear forwards;
    }

    @keyframes rise {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
    }
  </style>
</head>
<body>

  <!-- Floating Background Decorative Circles -->
  <div class="bg-bubble" style="width: 120px; height: 120px; top: 10%; left: 8%;"></div>
  <div class="bg-bubble" style="width: 80px; height: 80px; bottom: 15%; right: 10%; animation-delay: 2s;"></div>

  <div class="card">
    <span class="badge">Special Day 🎉</span>
    <h1>Happy Birthday!</h1>
    <p class="subtitle">Untuk seseorang yang sangat spesial ✨</p>

    <div class="message-box" id="secretMessage">
      <p>
        Selamat ulang tahun! 🎂<br><br>
        Semoga di usiamu yang baru ini selalu dilimpahkan kebahagiaan, kesehatan, dan kelancaran dalam segala hal yang sedang kamu perjuangkan.<br><br>
        <i>" Tetaplah tumbuh dan bersinar dengan caramu sendiri. "</i> 🌟
      </p>
    </div>

    <button class="btn" onclick="toggleMessage(event)">Buka Pesan 💌</button>
  </div>

  <script>
    function toggleMessage(e) {
      const msg = document.getElementById('secretMessage');
      const btn = e.target;
      
      if (!msg.classList.contains('open')) {
        msg.classList.add('open');
        btn.innerText = 'Tutup Pesan ✨';
        createHearts(e);
      } else {
        msg.classList.remove('open');
        btn.innerText = 'Buka Pesan 💌';
      }
    }

    function createHearts(e) {
      for (let i = 0; i < 8; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💖';
        heart.style.left = (e.clientX + (Math.random() * 80 - 40)) + 'px';
        heart.style.top = (e.clientY + (Math.random() * 40 - 20)) + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 2000);
      }
    }
  </script>
</body>
</html>
